<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Zero</title>
    <style>
        body { background: #F2F2F7; font-family: sans-serif; text-align: center; padding: 50px; }
        .tela { display: none; }
        .tela.ativa { display: block; }
        .btn { padding: 15px 30px; background: #007AFF; color: white; border: none; border-radius: 10px; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="tela1" class="tela ativa">
        <h1>Tela Inicial</h1>
        <p>Se você consegue ver isso, o HTML está funcionando.</p>
        <button class="btn" onclick="abrirQuiz()">Iniciar Teste</button>
    </div>

    <div id="tela2" class="tela">
        <h1>Tela do Quiz</h1>
        <p>O botão funcionou perfeitamente!</p>
        <button class="btn" onclick="voltar()">Voltar</button>
    </div>

    <script>
        function abrirQuiz() {
            document.getElementById('tela1').classList.remove('ativa');
            document.getElementById('tela2').classList.add('ativa');
        }
        function voltar() {
            document.getElementById('tela2').classList.remove('ativa');
            document.getElementById('tela1').classList.add('ativa');
        }
    </script>
</body>
</html>
